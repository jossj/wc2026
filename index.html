<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 – Match Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a1628; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #main-layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  #header {
    background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 100%);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 2px solid #c9a227;
    z-index: 1000;
    position: relative;
    flex-shrink: 0;
  }
  #header .logo {
    width: 48px; height: 48px;
    background: #c9a227;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #0a1628;
    flex-shrink: 0;
  }
  #header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  #header p  { font-size: 13px; color: #a0b4c8; margin-top: 2px; }

  #controls {
    background: #0f2035;
    padding: 10px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid #1e3a55;
    z-index: 999;
    position: relative;
  }
  #controls label { font-size: 12px; color: #a0b4c8; margin-right: 4px; }
  .filter-btn {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1.5px solid #2e5070;
    background: transparent;
    color: #c0d4e8;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .filter-btn:hover  { border-color: #c9a227; color: #c9a227; }
  .filter-btn.active { background: #c9a227; border-color: #c9a227; color: #0a1628; font-weight: 700; }

  #map-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  #map { flex: 1; min-height: 0; }

  /* News panel */
  #news-panel {
    width: 320px;
    flex-shrink: 0;
    background: #060e1c;
    border-left: 1px solid #1e3a55;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #news-header {
    background: linear-gradient(135deg, #0a1628, #1a2e42);
    padding: 12px 16px;
    border-bottom: 1px solid #1e3a55;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #news-header h2 { font-size: 13px; font-weight: 700; color: #c9a227; letter-spacing: 0.5px; display: flex; align-items: center; gap: 7px; }
  #news-header h2 svg { flex-shrink: 0; }
  #news-refresh {
    background: none; border: 1px solid #2e5070; color: #7a9ab8;
    border-radius: 4px; padding: 3px 8px; font-size: 10px; cursor: pointer;
    transition: all 0.15s;
  }
  #news-refresh:hover { border-color: #c9a227; color: #c9a227; }
  #news-source { font-size: 9px; color: #4a6a86; margin-top: 2px; }
  #news-list { overflow-y: auto; flex: 1; }
  #news-list::-webkit-scrollbar { width: 4px; }
  #news-list::-webkit-scrollbar-track { background: #060e1c; }
  #news-list::-webkit-scrollbar-thumb { background: #1e3a55; border-radius: 2px; }
  .news-item {
    padding: 12px 14px;
    border-bottom: 1px solid #0f1e30;
    cursor: pointer;
    transition: background 0.15s;
    text-decoration: none;
    display: block;
    color: inherit;
  }
  .news-item:hover { background: #0d1e30; }
  .news-item:hover .news-title { color: #c9a227; }
  .news-thumb {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 5px;
    margin-bottom: 8px;
    display: block;
    background: #0f2035;
  }
  .news-title {
    font-size: 12px;
    font-weight: 600;
    color: #e8f0f8;
    line-height: 1.45;
    margin-bottom: 5px;
    transition: color 0.15s;
  }
  .news-desc {
    font-size: 11px;
    color: #6a8aaa;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 5px;
  }
  .news-date { font-size: 10px; color: #3a5a76; }
  .news-loading { padding: 24px 16px; text-align: center; color: #4a6a86; font-size: 12px; }
  .news-error { padding: 16px; color: #c0392b; font-size: 11px; text-align: center; line-height: 1.5; }
  .news-dot { width: 7px; height: 7px; border-radius: 50%; background: #c9a227; animation: pulse 1.5s infinite; display: inline-block; margin-right: 4px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Group filter bar */
  #group-controls {
    background: #080f1e;
    padding: 7px 24px;
    display: flex;
    gap: 6px;
    align-items: center;
    border-bottom: 1px solid #1e3a55;
    flex-wrap: wrap;
  }
  #group-controls label { font-size: 12px; color: #a0b4c8; margin-right: 2px; white-space: nowrap; }
  .group-btn {
    width: 32px; height: 28px;
    border-radius: 6px;
    border: 1.5px solid #2e5070;
    background: transparent;
    color: #c0d4e8;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .group-btn:hover { border-color: #c9a227; color: #c9a227; }
  .group-btn.active {
    color: #0a1628;
    font-weight: 900;
    border-color: transparent;
  }
  /* Per-group colours */
  .group-btn[data-group="A"].active { background: #e63946; }
  .group-btn[data-group="B"].active { background: #f4a261; }
  .group-btn[data-group="C"].active { background: #2a9d8f; }
  .group-btn[data-group="D"].active { background: #457b9d; }
  .group-btn[data-group="E"].active { background: #8338ec; }
  .group-btn[data-group="F"].active { background: #06d6a0; }
  .group-btn[data-group="G"].active { background: #ef476f; }
  .group-btn[data-group="H"].active { background: #ffd166; }
  .group-btn[data-group="I"].active { background: #118ab2; }
  .group-btn[data-group="J"].active { background: #ff6b6b; }
  .group-btn[data-group="K"].active { background: #43aa8b; }
  .group-btn[data-group="L"].active { background: #c77dff; }
  /* Hover tints matching active colours */
  .group-btn[data-group="A"]:hover { border-color:#e63946; color:#e63946; }
  .group-btn[data-group="B"]:hover { border-color:#f4a261; color:#f4a261; }
  .group-btn[data-group="C"]:hover { border-color:#2a9d8f; color:#2a9d8f; }
  .group-btn[data-group="D"]:hover { border-color:#457b9d; color:#457b9d; }
  .group-btn[data-group="E"]:hover { border-color:#8338ec; color:#8338ec; }
  .group-btn[data-group="F"]:hover { border-color:#06d6a0; color:#06d6a0; }
  .group-btn[data-group="G"]:hover { border-color:#ef476f; color:#ef476f; }
  .group-btn[data-group="H"]:hover { border-color:#ffd166; color:#ffd166; }
  .group-btn[data-group="I"]:hover { border-color:#118ab2; color:#118ab2; }
  .group-btn[data-group="J"]:hover { border-color:#ff6b6b; color:#ff6b6b; }
  .group-btn[data-group="K"]:hover { border-color:#43aa8b; color:#43aa8b; }
  .group-btn[data-group="L"]:hover { border-color:#c77dff; color:#c77dff; }
  /* Group tag inside popup */
  .group-highlight {
    display: inline-block;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 800;
    color: #0a1628;
    margin-left: 4px;
  }

  /* Popup */
  .leaflet-popup-content-wrapper {
    background: #0f2035;
    border: 1.5px solid #c9a227;
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    color: #fff;
    min-width: 280px;
    max-width: 340px;
    padding: 0;
  }
  .leaflet-popup-tip { background: #0f2035; }
  .leaflet-popup-content { margin: 0; }
  .leaflet-popup-close-button { color: #a0b4c8 !important; font-size: 18px !important; top: 10px !important; right: 12px !important; }

  .popup-header {
    background: linear-gradient(135deg, #1a3a5c, #0f2035);
    padding: 14px 16px 10px;
    border-radius: 8px 8px 0 0;
    border-bottom: 1px solid #1e3a55;
  }
  .popup-city { font-size: 16px; font-weight: 700; color: #c9a227; }
  .popup-country { font-size: 11px; color: #7a9ab8; margin-top: 1px; text-transform: uppercase; letter-spacing: 1px; }
  .popup-count { font-size: 11px; color: #a0b4c8; margin-top: 4px; }

  .popup-matches { padding: 8px 0; max-height: 340px; overflow-y: auto; }
  .popup-matches::-webkit-scrollbar { width: 4px; }
  .popup-matches::-webkit-scrollbar-track { background: #0a1628; }
  .popup-matches::-webkit-scrollbar-thumb { background: #2e5070; border-radius: 2px; }

  .match-row {
    padding: 8px 16px;
    border-bottom: 1px solid #1a2e42;
    transition: background 0.15s;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: #152840; }

  .match-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
  }
  .match-num { font-size: 10px; color: #5a7a96; font-weight: 600; }
  .match-date { font-size: 10px; color: #7a9ab8; }
  .match-stage { font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }

  .stage-group    { background: #1a3a5c; color: #6baed6; }
  .stage-r32      { background: #1e3d1e; color: #74c476; }
  .stage-r16      { background: #3d3000; color: #fec44f; }
  .stage-qf       { background: #3d1200; color: #fd8d3c; }
  .stage-sf       { background: #2d1045; color: #bc80bd; }
  .stage-bronze   { background: #0d3020; color: #41ae76; }
  .stage-final    { background: #4d3500; color: #c9a227; }

  .match-teams {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .team {
    font-size: 15px;
    font-weight: 700;
    color: #e8f0f8;
    text-align: center;
    min-width: 44px;
  }
  .vs {
    font-size: 11px;
    color: #5a7a96;
    font-weight: 600;
    background: #1a2e42;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .match-times {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 5px;
  }
  .time-block { text-align: center; }
  .time-val   { font-size: 13px; font-weight: 700; color: #c9a227; }
  .time-val.user-time { color: #6baed6; }
  .time-label { font-size: 9px; color: #4a6a86; margin-top: 1px; text-transform: uppercase; letter-spacing: 0.5px; }
  .time-divider { color: #2e5070; font-size: 16px; align-self: center; }

  /* Custom marker */
  .venue-marker {
    background: #c9a227;
    border: 3px solid #fff;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .venue-marker:hover {
    box-shadow: 0 4px 16px rgba(201,162,39,0.7);
  }
  .venue-marker.canada  { background: #d52b1e; }
  .venue-marker.mexico  { background: #006847; }
  .venue-marker.usa     { background: #3c6eb4; }

  .marker-inner {
    transform: rotate(45deg);
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 900; color: #fff;
    padding-bottom: 4px;
  }

  /* Legend */
  .legend {
    background: #0f2035;
    border: 1px solid #1e3a55;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: #c0d4e8;
    line-height: 1.8;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  /* Team filter bar */
  #team-controls {
    background: #0a1a2e;
    padding: 8px 24px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid #1e3a55;
    z-index: 998;
    position: relative;
    flex-wrap: nowrap;
  }
  #team-controls label { font-size: 12px; color: #a0b4c8; white-space: nowrap; flex-shrink: 0; }
  #team-search-wrap {
    position: relative;
    flex-shrink: 0;
  }
  #team-search {
    background: #152840;
    border: 1.5px solid #2e5070;
    border-radius: 20px;
    color: #e8f0f8;
    font-size: 12px;
    padding: 5px 32px 5px 14px;
    width: 200px;
    outline: none;
    transition: border-color 0.18s;
  }
  #team-search:focus { border-color: #c9a227; }
  #team-search::placeholder { color: #4a6a86; }
  #search-clear {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: #5a7a96; cursor: pointer;
    font-size: 14px; line-height: 1;
    display: none;
  }
  #search-clear:hover { color: #c9a227; }
  #team-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: #0f2035;
    border: 1.5px solid #2e5070;
    border-radius: 8px;
    width: 220px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 9999;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  #team-dropdown::-webkit-scrollbar { width: 4px; }
  #team-dropdown::-webkit-scrollbar-thumb { background: #2e5070; border-radius: 2px; }
  .team-option {
    padding: 8px 14px;
    font-size: 12px;
    color: #c0d4e8;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #1a2e42;
  }
  .team-option:last-child { border-bottom: none; }
  .team-option:hover { background: #1a3a5c; color: #fff; }
  .team-option.selected { background: #1a3a5c; color: #c9a227; font-weight: 700; }
  .team-option .team-code { font-weight: 700; min-width: 36px; color: #e8f0f8; }
  .team-option .team-full { color: #7a9ab8; font-size: 11px; }
  #active-team-chip {
    display: none;
    align-items: center;
    gap: 6px;
    background: #c9a227;
    color: #0a1628;
    border-radius: 20px;
    padding: 4px 10px 4px 12px;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  #active-team-chip button {
    background: none; border: none;
    color: #0a1628; cursor: pointer;
    font-size: 14px; line-height: 1;
    padding: 0; margin-left: 2px;
  }
  #active-team-chip button:hover { color: #5a3000; }
  .team-match-count {
    margin-left: auto;
    font-size: 10px;
    color: #5a7a96;
  }
  /* Dim markers that have no matches for current filter */
  .marker-dimmed { opacity: 0.25; filter: grayscale(80%); }
</style>
</head>
<body>

<div id="header">
  <div class="logo">⚽</div>
  <div>
    <h1>FIFA World Cup 2026 – Host Venues</h1>
    <p>104 matches across 16 cities in USA, Canada &amp; Mexico · Click a pin to see matches</p>
  </div>
  <a href="FWC26_Wallchart.html" style="padding:6px 14px;border-radius:16px;border:1.5px solid #c9a227;color:#c9a227;font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none;transition:all .18s" onmouseover="this.style.background='#c9a227';this.style.color='#0a1628'" onmouseout="this.style.background='';this.style.color='#c9a227'">📋 Wallchart</a>
  <div style="display:none">
  </div>
</div>

<div id="main-layout">
<div id="map-col">
<div id="controls">

  <label>Filter by stage:</label>
  <button class="filter-btn active" data-stage="all">All Matches</button>
  <button class="filter-btn" data-stage="Group Stage">Group Stage</button>
  <button class="filter-btn" data-stage="Round of 32">Round of 32</button>
  <button class="filter-btn" data-stage="Round of 16">Round of 16</button>
  <button class="filter-btn" data-stage="Quarterfinal">Quarterfinal</button>

</div>

<div id="team-controls">

    <div id="team-dropdown"></div>
  </div>
  <div id="active-team-chip">
    <span id="chip-label"></span>
    <button id="chip-clear" title="Clear team filter">✕</button>

</div>

<div id="group-controls">
  <label>Filter by group:</label>
  <button class="group-btn" data-group="A">A</button>
  <button class="group-btn" data-group="B">B</button>
  <button class="group-btn" data-group="C">C</button>
  <button class="group-btn" data-group="D">D</button>
  <button class="group-btn" data-group="E">E</button>
  <button class="group-btn" data-group="F">F</button>
  <button class="group-btn" data-group="G">G</button>
  <button class="group-btn" data-group="H">H</button>
  <button class="group-btn" data-group="I">I</button>
  <button class="group-btn" data-group="J">J</button>
  <button class="group-btn" data-group="K">K</button>

</div>

<div id="map"></div>
</div><!-- end map-col -->

<div id="news-panel">
  <div id="news-header">
    <div>
      <h2>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9a227" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg>
        World Cup News
      </h2>
      <div id="news-source">via Fox Sports</div>
    </div>
    <button id="news-refresh" title="Refresh feed">↻ Refresh</button>
  </div>
  <div id="news-list"><div class="news-loading"><span class="news-dot"></span> Loading latest news…</div></div>
  <div id="news-footer" style="padding:8px 14px;border-top:1px solid #0f1e30;font-size:10px;color:#2e5070;line-height:1.5;flex-shrink:0;">
    Run <code style="background:#0a1628;padding:1px 4px;border-radius:3px;color:#4a8ab8">news_proxy.py</code> for best results
  </div>
</div>

</div><!-- end main-layout -->

<script>

  { name: "Dallas",                   country: "USA",     flag: "🇺🇸", lat: 32.7480, lng: -97.0930,  tz: "CDT",  tzLabel: "Central",  utcOffset: 5 },

const MONTH_MAP = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };

// Parse "Thu Jun 11" + "15:00" + utcOffset(hours) → UTC timestamp (ms)
function matchToUTC(dateStr, timeStr, utcOffset) {
  const parts = dateStr.trim().split(' ');           // ["Thu", "Jun", "11"]
  const month = MONTH_MAP[parts[1]];
  const day   = parseInt(parts[2], 10);
  const [hh, mm] = timeStr.split(':').map(Number);
  // Build UTC: venue local + offset = UTC
  return Date.UTC(2026, month, day, hh + utcOffset, mm, 0);
}

// Format a UTC ms value in a given IANA timezone → "HH:MM"
function formatTime(utcMs, ianaZone) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: ianaZone,
    hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(new Date(utcMs));
}

// Format a UTC ms value → short day+date in user's timezone
function formatDateShort(utcMs, ianaZone) {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: ianaZone,
    weekday: 'short', month: 'short', day: 'numeric',
  }).format(new Date(utcMs));
}

// Venue IANA timezone lookup

  "PDT": "America/Los_Angeles",
  "CDT_MX": "America/Mexico_City",
  "CDT": "America/Chicago",
  "EDT": "America/New_York",
};
function venueIANA(v) {
  if (v.utcOffset === 7) return "America/Los_Angeles";
  if (v.utcOffset === 6) return "America/Mexico_City";
  if (v.utcOffset === 5) return "America/Chicago";
  return "America/New_York";
}

// User's local IANA timezone (detected from browser)
const USER_TZ      = Intl.DateTimeFormat().resolvedOptions().timeZone;
const USER_TZ_SHORT = (() => {
  try {
    return new Intl.DateTimeFormat('en-US', { timeZone: USER_TZ, timeZoneName: 'short' })
      .formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value || USER_TZ;
  } catch { return USER_TZ; }
})();

function createMarkerIcon(country) {
  const cls = country === 'Canada' ? 'canada' : country === 'Mexico' ? 'mexico' : 'usa';
  return L.divIcon({
    className: '',
    html: `<div class="venue-marker ${cls}" style="width:28px;height:28px;"><div class="marker-inner">⚽</div></div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 28],
    popupAnchor: [0, -30],
  });
}

function buildPopup(venue, filter) {
  const v = VENUES.find(x => x.name === venue.name);
  let filtered = venueMatches[venue.name] || [];
  if (filter !== 'all') {
    if (filter === 'Final') {
      filtered = filtered.filter(m => m.stage === 'Final' || m.stage === 'Bronze Final');
    } else {
      filtered = filtered.filter(m => m.stage === filter);
    }
  }

  if (filtered.length === 0) return null;

  const totalAll = (venueMatches[venue.name] || []).length;
  const rows = filtered.map(m => {
    const stageClass = STAGE_CLASS[m.stage] || 'stage-group';
    const teamDisplay = m.t2
      ? `<div class="match-teams"><div class="team">${m.t1}</div><div class="vs">vs</div><div class="team">${m.t2}</div></div>`
      : `<div class="match-teams"><div class="team" style="font-size:13px">${m.t1}</div></div>`;
    return `
      <div class="match-row">
        <div class="match-meta">
          <span class="match-num">Match #${m.n}</span>
          <span class="match-date">${m.date}</span>
          <span class="match-stage ${stageClass}">${m.stage}</span>
        </div>
        ${teamDisplay}
        <div class="match-time">${m.time} <span>local time · ${v ? v.tz : ''}</span></div>
      </div>`;
  }).join('');

  return `
    <div class="popup-header">
      <div class="popup-city">${v ? v.flag : ''} ${venue.name}</div>
      <div class="popup-country">${v ? v.country : ''}</div>
      <div class="popup-count">${filtered.length} match${filtered.length !== 1 ? 'es' : ''} shown${filter !== 'all' ? ` · ${totalAll} total` : ''}</div>
    </div>
    <div class="popup-matches">${rows}</div>`;
}

VENUES.forEach(v => {
  const icon = createMarkerIcon(v.country);
  const marker = L.marker([v.lat, v.lng], { icon })
    .addTo(map)
    .bindPopup('', { maxWidth: 360, minWidth: 300 });

  marker._venueData = v;

  marker.on('click', function() {
    const content = buildPopup(v, activeFilter);
    if (content) {
      this.setPopupContent(content);
      this.openPopup();
    }
  });

  // Tooltip (hover)
  const count = (venueMatches[v.name] || []).length;
  marker.bindTooltip(`<b>${v.flag} ${v.name}</b><br>${count} matches`, {
    direction: 'top',
    offset: [0, -30],
    className: 'leaflet-tooltip',
  });

  markers.push(marker);
});

  {code:"ALG", name:"Algeria"},         {code:"ARG", name:"Argentina"},
  {code:"AUS", name:"Australia"},       {code:"AUT", name:"Austria"},
  {code:"BEL", name:"Belgium"},         {code:"BIH", name:"Bosnia & Herzegovina"},
  {code:"BRA", name:"Brazil"},          {code:"CAN", name:"Canada"},
  {code:"CPV", name:"Cabo Verde"},      {code:"CIV", name:"Côte d'Ivoire"},
  {code:"COD", name:"Congo DR"},        {code:"COL", name:"Colombia"},
  {code:"CRO", name:"Croatia"},         {code:"CUW", name:"Curaçao"},
  {code:"CZE", name:"Czechia"},         {code:"ECU", name:"Ecuador"},
  {code:"EGY", name:"Egypt"},           {code:"ENG", name:"England"},
  {code:"ESP", name:"Spain"},           {code:"FRA", name:"France"},
  {code:"GER", name:"Germany"},         {code:"GHA", name:"Ghana"},
  {code:"HAI", name:"Haiti"},           {code:"IRN", name:"IR Iran"},
  {code:"IRQ", name:"Iraq"},            {code:"JPN", name:"Japan"},
  {code:"JOR", name:"Jordan"},          {code:"KOR", name:"Korea Republic"},
  {code:"KSA", name:"Saudi Arabia"},    {code:"MAR", name:"Morocco"},
  {code:"MEX", name:"Mexico"},          {code:"NED", name:"Netherlands"},
  {code:"NOR", name:"Norway"},          {code:"NZL", name:"New Zealand"},
  {code:"PAN", name:"Panama"},          {code:"PAR", name:"Paraguay"},
  {code:"POR", name:"Portugal"},        {code:"QAT", name:"Qatar"},
  {code:"RSA", name:"South Africa"},    {code:"SCO", name:"Scotland"},
  {code:"SEN", name:"Senegal"},         {code:"SUI", name:"Switzerland"},
  {code:"SWE", name:"Sweden"},          {code:"TUN", name:"Tunisia"},
  {code:"TUR", name:"Türkiye"},         {code:"URU", name:"Uruguay"},
  {code:"USA", name:"USA"},             {code:"UZB", name:"Uzbekistan"},
];

// Count group-stage matches per team to show in dropdown
const teamMatchCount = {};
TEAMS.forEach(t => {
  teamMatchCount[t.code] = MATCHES.filter(m => m.t1 === t.code || m.t2 === t.code).length;
});

let activeTeam = null; // code string or null

// Build venue → matches filtered by stage / team / group
function matchesForVenue(venueName, stageFilter, teamFilter) {
  let list = venueMatches[venueName] || [];
  if (stageFilter !== 'all') {
    if (stageFilter === 'Final') {
      list = list.filter(m => m.stage === 'Final' || m.stage === 'Bronze Final');
    } else {
      list = list.filter(m => m.stage === stageFilter);
    }
  }
  if (teamFilter) {
    list = list.filter(m => m.t1 === teamFilter || m.t2 === teamFilter);
  }
  if (activeGroup) {
    list = list.filter(m => m.group === activeGroup);
  }
  return list;
}

function refreshMarkers() {
  markers.forEach(marker => {
    const count = matchesForVenue(marker._venueData.name, activeFilter, activeTeam).length;
    const el = marker.getElement();
    if (el) {
      if (count === 0) el.classList.add('marker-dimmed');
      else el.classList.remove('marker-dimmed');
    }
    if (marker.isPopupOpen()) {
      const content = buildPopupFull(marker._venueData);
      if (content) marker.setPopupContent(content);
      else marker.closePopup();
    }
  });
}

function buildPopupFull(v) {
  const filtered = matchesForVenue(v.name, activeFilter, activeTeam);
  if (filtered.length === 0) return null;
  const total = (venueMatches[v.name] || []).length;
  const vInfo = VENUES.find(x => x.name === v.name);
  const rows = filtered.map(m => {
    const stageClass = STAGE_CLASS[m.stage] || 'stage-group';
    const t1class = activeTeam && m.t1 === activeTeam ? ' style="color:#c9a227"' : '';
    const t2class = activeTeam && m.t2 === activeTeam ? ' style="color:#c9a227"' : '';
    const groupBadge = m.group
      ? `<span class="group-highlight" style="background:${GROUP_COLOURS[m.group]}">Grp ${m.group}</span>`
      : '';
    const teamDisplay = m.t2
      ? `<div class="match-teams"><div class="team"${t1class}>${m.t1}</div><div class="vs">vs</div><div class="team"${t2class}>${m.t2}</div></div>`
      : `<div class="match-teams"><div class="team" style="font-size:13px">${m.t1}</div></div>`;

    // Time calculations
    let timesHTML = '';
    if (vInfo) {
      const utcMs    = matchToUTC(m.date, m.time, vInfo.utcOffset);
      const venueTime = formatTime(utcMs, venueIANA(vInfo));
      const userTime  = formatTime(utcMs, USER_TZ);
      const userDate  = formatDateShort(utcMs, USER_TZ);
      const sameTime  = venueTime === userTime && venueIANA(vInfo) === USER_TZ;

      if (sameTime) {
        timesHTML = `
          <div class="match-times">
            <div class="time-block">
              <div class="time-val">${venueTime}</div>
              <div class="time-label">${vInfo.tz} · ${vInfo.tzLabel}</div>
            </div>
          </div>`;
      } else {
        timesHTML = `
          <div class="match-times">
            <div class="time-block">
              <div class="time-val">${venueTime}</div>
              <div class="time-label">${vInfo.tz} · venue</div>
            </div>
            <div class="time-divider">·</div>
            <div class="time-block">
              <div class="time-val user-time">${userTime}</div>
              <div class="time-label">${USER_TZ_SHORT} · your time</div>
            </div>
          </div>`;
      }
      // Show user's local date if it differs from match date
      const venueDateStr = m.date;
      const localDateStr = userDate;
      if (!venueDateStr.includes(localDateStr.split(' ').pop())) {
        timesHTML += `<div style="text-align:center;font-size:9px;color:#3a5a76;margin-top:2px;">(your date: ${localDateStr})</div>`;
      }
    }

    return `
      <div class="match-row">
        <div class="match-meta">
          <span class="match-num">Match #${m.n}</span>
          <span class="match-date">${m.date}</span>
          <span class="match-stage ${stageClass}">${m.stage}</span>${groupBadge}
        </div>
        ${teamDisplay}
        ${timesHTML}
      </div>`;
  }).join('');

  return `
    <div class="popup-header">
      <div class="popup-city">${vInfo ? vInfo.flag : ''} ${v.name}</div>
      <div class="popup-country">${vInfo ? vInfo.country : ''}</div>
      <div class="popup-count">${filtered.length} match${filtered.length !== 1 ? 'es' : ''} shown${filtered.length < total ? ` · ${total} total` : ''}</div>
    </div>
    <div class="popup-matches">${rows}</div>`;
}

// Replace original buildPopup usage on markers with buildPopupFull
markers.forEach(marker => {
  marker.off('click');
  marker.on('click', function() {
    const content = buildPopupFull(this._venueData);
    if (content) { this.setPopupContent(content); this.openPopup(); }
  });
});

// ── Stage filter buttons ──────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.stage;
    refreshMarkers();
  });
});

// ── Team search / dropdown ────────────────────────────────────────────────────
const searchInput   = document.getElementById('team-search');
const searchClear   = document.getElementById('search-clear');
const dropdown      = document.getElementById('team-dropdown');
const chip          = document.getElementById('active-team-chip');
const chipLabel     = document.getElementById('chip-label');
const chipClearBtn  = document.getElementById('chip-clear');

function renderDropdown(query) {
  const q = query.toLowerCase();
  const filtered = TEAMS.filter(t =>
    t.code.toLowerCase().includes(q) || t.name.toLowerCase().includes(q)
  );
  if (filtered.length === 0) {
    dropdown.innerHTML = `<div class="team-option" style="color:#5a7a96;cursor:default">No results</div>`;
  } else {
    dropdown.innerHTML = filtered.map(t => `
      <div class="team-option${activeTeam === t.code ? ' selected' : ''}" data-code="${t.code}">
        <span class="team-code">${t.code}</span>
        <span class="team-full">${t.name}</span>
        <span class="team-match-count">${teamMatchCount[t.code] || 0}▸</span>
      </div>`).join('');
    dropdown.querySelectorAll('.team-option[data-code]').forEach(el => {
      el.addEventListener('click', () => selectTeam(el.dataset.code, TEAMS.find(t=>t.code===el.dataset.code)?.name));
    });
  }
  dropdown.style.display = 'block';
}

function selectTeam(code, name) {
  activeTeam = code;
  searchInput.value = '';
  searchClear.style.display = 'none';
  dropdown.style.display = 'none';
  chipLabel.textContent = `${code} – ${name}`;
  chip.style.display = 'flex';
  refreshMarkers();
}

function clearTeam() {
  activeTeam = null;
  chip.style.display = 'none';
  chipLabel.textContent = '';
  refreshMarkers();
}

searchInput.addEventListener('input', function() {
  searchClear.style.display = this.value ? 'block' : 'none';
  renderDropdown(this.value);
});
searchInput.addEventListener('focus', function() {
  renderDropdown(this.value);
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  dropdown.style.display = 'none';
});
chipClearBtn.addEventListener('click', clearTeam);

document.addEventListener('click', e => {
  if (!document.getElementById('team-search-wrap').contains(e.target)) {
    dropdown.style.display = 'none';
  }
});

// ── RSS News Feed ─────────────────────────────────────────────────────────────
const RSS_URL = 'https://api.foxsports.com/v2/content/optimized-rss?partnerKey=MB0Wehpmuj2lUhuRhQaafhBjAJqaPU244mlTDK1i&size=30&tags=soccer%2Fwc%2Fleague%2F12';

// Local proxy (news_proxy.py) is tried first — fastest and most reliable.
// External CORS proxies are fallbacks if the local server isn't running.
const PROXIES = [
  _url => `http://localhost:9876/rss`,
  url  => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url  => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url  => `https://proxy.cors.sh/${url}`,
];

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function parseRSS(text) {
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  // Check for parse errors
  if (xml.querySelector('parsererror')) throw new Error('Invalid XML');
  const items = Array.from(xml.querySelectorAll('item'));
  if (!items.length) throw new Error('No items found');
  return items;
}

function renderItems(items) {
  const ns = 'http://search.yahoo.com/mrss/';
  return items.map(item => {
    const title   = item.querySelector('title')?.textContent?.trim() || '';
    const link    = item.querySelector('link')?.textContent?.trim() || '#';
    const desc    = item.querySelector('description')?.textContent?.trim() || '';
    const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';
    const thumb   = item.getElementsByTagNameNS(ns, 'thumbnail')[0]?.getAttribute('url')
                 || item.getElementsByTagNameNS(ns, 'content')[0]?.getAttribute('url')
                 || '';
    const imgTag    = thumb ? `<img class="news-thumb" src="${thumb}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
    const cleanDesc = desc.replace(/<[^>]*>/g, '').slice(0, 120);
    return `<a class="news-item" href="${link}" target="_blank" rel="noopener">
      ${imgTag}
      <div class="news-title">${title}</div>
      ${cleanDesc ? `<div class="news-desc">${cleanDesc}…</div>` : ''}
      <div class="news-date">${timeAgo(pubDate)}</div>
    </a>`;
  }).join('');
}

async function tryFetch(proxyFn) {
  const res = await fetch(proxyFn(RSS_URL), { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  // allorigins wraps in JSON
  if (text.trim().startsWith('{')) {
    const json = JSON.parse(text);
    return json.contents || json.data || text;
  }
  return text;
}

async function loadNews() {
  const list = document.getElementById('news-list');
  list.innerHTML = '<div class="news-loading"><span class="news-dot"></span> Loading latest news…</div>';

  let lastErr = null;
  for (const proxyFn of PROXIES) {
    try {
      const text  = await tryFetch(proxyFn);
      const items = parseRSS(text);
      list.innerHTML = renderItems(items);
      return; // success
    } catch (err) {
      lastErr = err;
    }
  }

  // All proxies failed
  list.innerHTML = `
    <div class="news-error">
      ⚠️ Could not load the news feed.<br>
      <small style="color:#4a6a86">${lastErr?.message || 'All proxies failed'}</small><br><br>
      <button onclick="loadNews()" style="background:#1a3a5c;border:1px solid #2e5070;color:#c0d4e8;padding:5px 14px;border-radius:4px;cursor:pointer;font-size:11px;">↻ Try again</button>
    </div>`;
}

document.getElementById('news-refresh').addEventListener('click', loadNews);
loadNews();

// ── Group filter buttons ──────────────────────────────────────────────────────
const groupLabel = document.getElementById('group-label');

document.querySelectorAll('.group-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const g = this.dataset.group;
    if (activeGroup === g) {
      // Toggle off
      activeGroup = null;
      this.classList.remove('active');
      groupLabel.textContent = '';
    } else {
      document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      activeGroup = g;
      const teams = GROUP_TEAMS[g] ? GROUP_TEAMS[g].join(' · ') : '';
      groupLabel.style.color = GROUP_COLOURS[g];
      groupLabel.textContent = `Group ${g}: ${teams}`;
    }
    // When a group is selected, auto-switch stage filter to Group Stage (or all if toggling off)
    if (activeGroup) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.filter-btn[data-stage="Group Stage"]').classList.add('active');
      activeFilter = 'Group Stage';
    } else {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.filter-btn[data-stage="all"]').classList.add('active');
      activeFilter = 'all';
    }
    refreshMarkers();
  });
});
