<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FIFA World Cup 2026 – Host Venues</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ── Base ─────────────────────────────────────────────────────────────────── */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0a1628; color: #fff; }

/* ── Layout: header + filters + map stacked ──────────────────────────────── */
#page { display: flex; flex-direction: column; height: 100%; }
#map  { flex: 1; min-height: 0; }

/* ── Header ──────────────────────────────────────────────────────────────── */
#header {
  background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 100%);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 2px solid #c9a227;
  flex-shrink: 0;
  flex-wrap: wrap;
}
.logo {
  width: 38px; height: 38px; flex-shrink: 0;
  background: #c9a227; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900; color: #0a1628;
}
.header-text { flex: 1; min-width: 0; }
.header-text h1 { font-size: clamp(14px, 3vw, 20px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-text p  { font-size: clamp(10px, 2vw, 12px); color: #a0b4c8; margin-top: 1px; }
.wallchart-link {
  padding: 5px 12px; border-radius: 14px; border: 1.5px solid #c9a227;
  color: #c9a227; font-size: 12px; font-weight: 700; white-space: nowrap;
  text-decoration: none; flex-shrink: 0; transition: all .18s;
}
.wallchart-link:hover { background: #c9a227; color: #0a1628; }

/* ── Filter bars ─────────────────────────────────────────────────────────── */
.filter-bar {
  background: #0f2035;
  padding: 6px 12px;
  display: flex;
  gap: 6px;
  align-items: center;
  border-bottom: 1px solid #1e3a55;
  flex-shrink: 0;
  flex-wrap: wrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-bar label { font-size: 11px; color: #a0b4c8; white-space: nowrap; flex-shrink: 0; }

.filter-btn {
  padding: 4px 11px;
  border-radius: 14px;
  border: 1.5px solid #2e5070;
  background: transparent;
  color: #c0d4e8;
  font-size: 11px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.filter-btn:hover  { border-color: #c9a227; color: #c9a227; }
.filter-btn.active { background: #c9a227; border-color: #c9a227; color: #0a1628; font-weight: 700; }

/* ── Team search bar ─────────────────────────────────────────────────────── */
#team-bar { background: #0a1a2e; }
#team-search-wrap { position: relative; flex-shrink: 0; }
#team-search {
  background: #152840; border: 1.5px solid #2e5070; border-radius: 14px;
  color: #e8f0f8; font-size: 11px; padding: 4px 28px 4px 12px;
  width: clamp(130px, 30vw, 200px); outline: none; transition: border-color .18s;
}
#team-search:focus { border-color: #c9a227; }
#team-search::placeholder { color: #4a6a86; }
#search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: #5a7a96; cursor: pointer; font-size: 13px; display: none;
}
#search-clear:hover { color: #c9a227; }
#team-dropdown {
  position: absolute; top: calc(100% + 4px); left: 0;
  background: #0f2035; border: 1.5px solid #2e5070; border-radius: 8px;
  width: 220px; max-height: 240px; overflow-y: auto;
  z-index: 9999; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
#team-dropdown::-webkit-scrollbar { width: 4px; }
#team-dropdown::-webkit-scrollbar-thumb { background: #2e5070; border-radius: 2px; }
.team-option {
  padding: 7px 12px; font-size: 11px; color: #c0d4e8; cursor: pointer;
  display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1a2e42;
}
.team-option:last-child { border-bottom: none; }
.team-option:hover, .team-option.selected { background: #1a3a5c; }
.team-option.selected { color: #c9a227; font-weight: 700; }
.team-code { font-weight: 700; min-width: 34px; color: #e8f0f8; }
.team-full { color: #7a9ab8; font-size: 10px; flex: 1; }
.team-match-count { font-size: 10px; color: #5a7a96; margin-left: auto; }
#active-team-chip {
  display: none; align-items: center; gap: 5px;
  background: #c9a227; color: #0a1628; border-radius: 14px;
  padding: 3px 8px 3px 10px; font-size: 11px; font-weight: 700; flex-shrink: 0;
}
#active-team-chip button { background: none; border: none; color: #0a1628; cursor: pointer; font-size: 13px; padding: 0; }

/* ── Group filter bar ─────────────────────────────────────────────────────── */
#group-bar { background: #080f1e; }
.group-btn {
  width: 28px; height: 26px; border-radius: 5px; border: 1.5px solid #2e5070;
  background: transparent; color: #c0d4e8; font-size: 11px; font-weight: 700;
  cursor: pointer; transition: all .15s; flex-shrink: 0;
}
.group-btn:hover { border-color: #c9a227; color: #c9a227; }
.group-btn.active { color: #0a1628; font-weight: 900; border-color: transparent; }
.group-btn[data-group="A"].active{background:#e63946}.group-btn[data-group="B"].active{background:#f4a261}
.group-btn[data-group="C"].active{background:#2a9d8f}.group-btn[data-group="D"].active{background:#457b9d}
.group-btn[data-group="E"].active{background:#8338ec}.group-btn[data-group="F"].active{background:#06d6a0}
.group-btn[data-group="G"].active{background:#ef476f}.group-btn[data-group="H"].active{background:#ffd166}
.group-btn[data-group="I"].active{background:#118ab2}.group-btn[data-group="J"].active{background:#ff6b6b}
.group-btn[data-group="K"].active{background:#43aa8b}.group-btn[data-group="L"].active{background:#c77dff}
.group-btn[data-group="A"]:hover{border-color:#e63946;color:#e63946}.group-btn[data-group="B"]:hover{border-color:#f4a261;color:#f4a261}
.group-btn[data-group="C"]:hover{border-color:#2a9d8f;color:#2a9d8f}.group-btn[data-group="D"]:hover{border-color:#457b9d;color:#457b9d}
.group-btn[data-group="E"]:hover{border-color:#8338ec;color:#8338ec}.group-btn[data-group="F"]:hover{border-color:#06d6a0;color:#06d6a0}
.group-btn[data-group="G"]:hover{border-color:#ef476f;color:#ef476f}.group-btn[data-group="H"]:hover{border-color:#ffd166;color:#ffd166}
.group-btn[data-group="I"]:hover{border-color:#118ab2;color:#118ab2}.group-btn[data-group="J"]:hover{border-color:#ff6b6b;color:#ff6b6b}
.group-btn[data-group="K"]:hover{border-color:#43aa8b;color:#43aa8b}.group-btn[data-group="L"]:hover{border-color:#c77dff;color:#c77dff}
#group-label { font-size: 10px; margin-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Popup ────────────────────────────────────────────────────────────────── */
.leaflet-popup-content-wrapper {
  background: #0f2035; border: 1.5px solid #c9a227; border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,.6); color: #fff;
  min-width: 260px; max-width: min(340px, 92vw); padding: 0;
}
.leaflet-popup-tip { background: #0f2035; }
.leaflet-popup-content { margin: 0; }
.leaflet-popup-close-button { color: #a0b4c8 !important; font-size: 18px !important; top: 10px !important; right: 12px !important; }

.popup-header {
  background: linear-gradient(135deg, #1a3a5c, #0f2035);
  padding: 12px 14px 8px; border-radius: 8px 8px 0 0; border-bottom: 1px solid #1e3a55;
}
.popup-city    { font-size: 15px; font-weight: 700; color: #c9a227; }
.popup-country { font-size: 10px; color: #7a9ab8; margin-top: 1px; text-transform: uppercase; letter-spacing: 1px; }
.popup-count   { font-size: 10px; color: #a0b4c8; margin-top: 3px; }

.popup-matches { padding: 6px 0; max-height: 55vh; overflow-y: auto; }
.popup-matches::-webkit-scrollbar { width: 4px; }
.popup-matches::-webkit-scrollbar-track { background: #0a1628; }
.popup-matches::-webkit-scrollbar-thumb { background: #2e5070; border-radius: 2px; }

.match-row { padding: 7px 14px; border-bottom: 1px solid #1a2e42; }
.match-row:last-child { border-bottom: none; }
.match-meta { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 4px; flex-wrap: wrap; }
.match-num   { font-size: 9px; color: #5a7a96; font-weight: 600; }
.match-date  { font-size: 9px; color: #7a9ab8; }
.match-stage { font-size: 9px; padding: 1px 6px; border-radius: 10px; font-weight: 600; white-space: nowrap; }

.stage-group  { background: #1a3a5c; color: #6baed6; }
.stage-r32    { background: #1e3d1e; color: #74c476; }
.stage-r16    { background: #3d3000; color: #fec44f; }
.stage-qf     { background: #3d1200; color: #fd8d3c; }
.stage-sf     { background: #2d1045; color: #bc80bd; }
.stage-bronze { background: #0d3020; color: #41ae76; }
.stage-final  { background: #4d3500; color: #c9a227; }

.group-highlight { display: inline-block; border-radius: 3px; padding: 1px 5px; font-size: 9px; font-weight: 800; color: #0a1628; margin-left: 3px; }

.match-teams { display: flex; align-items: center; justify-content: center; gap: 6px; }
.team { font-size: 14px; font-weight: 700; color: #e8f0f8; text-align: center; min-width: 38px; }
.vs   { font-size: 10px; color: #5a7a96; font-weight: 600; background: #1a2e42; padding: 2px 5px; border-radius: 3px; }

.match-times { display: flex; justify-content: center; gap: 14px; margin-top: 5px; }
.time-block  { text-align: center; }
.time-val    { font-size: 12px; font-weight: 700; color: #c9a227; }
.time-val.user-time { color: #6baed6; }
.time-label  { font-size: 8px; color: #4a6a86; margin-top: 1px; text-transform: uppercase; letter-spacing: .4px; }
.time-divider { color: #2e5070; font-size: 14px; align-self: center; }

/* ── Markers ─────────────────────────────────────────────────────────────── */
.venue-marker {
  background: #c9a227; border: 3px solid #fff; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg); box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.venue-marker.canada { background: #d52b1e; }
.venue-marker.mexico { background: #006847; }
.venue-marker.usa    { background: #3c6eb4; }
.marker-inner {
  transform: rotate(45deg); width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; padding-bottom: 3px;
}
.marker-dimmed { opacity: .25; filter: grayscale(80%); }

/* ── Legend ──────────────────────────────────────────────────────────────── */
.legend { background: #0f2035; border: 1px solid #1e3a55; border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #c0d4e8; line-height: 1.8; }
.legend-item { display: flex; align-items: center; gap: 7px; }
.legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ── Responsive tweaks ───────────────────────────────────────────────────── */
@media (max-width: 480px) {
  #header { padding: 8px 12px; gap: 8px; }
  .logo   { width: 32px; height: 32px; font-size: 15px; }
  .filter-bar { padding: 5px 10px; gap: 5px; }
  .filter-btn { padding: 3px 9px; font-size: 10px; }
  .group-btn  { width: 26px; height: 24px; font-size: 10px; }
  .wallchart-link { font-size: 11px; padding: 4px 10px; }
  /* Full-width popup on small screens */
  .leaflet-popup-content-wrapper { min-width: 0; width: 90vw !important; }
}
</style>
</head>
<body>
<div id="page">

  <!-- Header -->
  <div id="header">
    <div class="logo">⚽</div>
    <div class="header-text">
      <h1>FIFA World Cup 2026 – Host Venues</h1>
      <p>104 matches · 16 cities · USA, Canada &amp; Mexico</p>
    </div>
    <a href="FWC26_Wallchart.html" class="wallchart-link">📋 Wallchart</a>
  </div>

  <!-- Stage filter -->
  <div class="filter-bar" id="stage-bar">
    <label>Stage:</label>
    <button class="filter-btn active" data-stage="all">All</button>

    <div id="active-team-chip">

</div><!-- end #page -->

function matchToUTC(dateStr, timeStr, utcOffset) {
  const p = dateStr.trim().split(' ');
  const [hh,mm] = timeStr.split(':').map(Number);
  return Date.UTC(2026, MONTH_MAP[p[1]], parseInt(p[2],10), hh + utcOffset, mm, 0);
}
function formatTime(ms, tz) {
  return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ms));
}
function formatDateShort(ms, tz) {
  return new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'short',month:'short',day:'numeric'}).format(new Date(ms));
}
function venueIANA(v) {
  if (v.utcOffset===7) return "America/Los_Angeles";
  if (v.utcOffset===6) return "America/Mexico_City";
  if (v.utcOffset===5) return "America/Chicago";
  return "America/New_York";
}

const STAGE_CLASS = {
  "Group Stage":"stage-group","Round of 32":"stage-r32","Round of 16":"stage-r16",
  "Quarterfinal":"stage-qf","Semifinal":"stage-sf","Bronze Final":"stage-bronze","Final":"stage-final",

  A:"#e63946",B:"#f4a261",C:"#2a9d8f",D:"#457b9d",
  E:"#8338ec",F:"#06d6a0",G:"#ef476f",H:"#ffd166",
  I:"#118ab2",J:"#ff6b6b",K:"#43aa8b",L:"#c77dff",
};

  A:["MEX","RSA","KOR","CZE"], B:["CAN","BIH","QAT","SUI"],
  C:["BRA","MAR","HAI","SCO"], D:["USA","PAR","AUS","TUR"],
  E:["GER","CUW","CIV","ECU"], F:["NED","JPN","SWE","TUN"],
  G:["BEL","EGY","IRN","NZL"], H:["ESP","CPV","KSA","URU"],
  I:["FRA","SEN","IRQ","NOR"], J:["ARG","ALG","AUT","JOR"],
  K:["POR","COD","UZB","COL"], L:["ENG","CRO","GHA","PAN"],

  {code:"ESP",name:"Spain"},{code:"FRA",name:"France"},{code:"GER",name:"Germany"},

  {code:"IRQ",name:"Iraq"},{code:"JPN",name:"Japan"},{code:"JOR",name:"Jordan"},

const teamMatchCount = {};
TEAMS.forEach(t => { teamMatchCount[t.code] = MATCHES.filter(m => m.t1===t.code||m.t2===t.code).length; });

// ── State ─────────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let activeTeam   = null;
let activeGroup  = null;

// ── Venue → matches index ─────────────────────────────────────────────────────
const venueMatches = {};
MATCHES.forEach(m => { (venueMatches[m.venue] = venueMatches[m.venue]||[]).push(m); });

// ── Map init ──────────────────────────────────────────────────────────────────
const map = L.map('map', { center:[38,-96], zoom:4, minZoom:3 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OSM &copy; CARTO', subdomains:'abcd', maxZoom:19
}).addTo(map);

function createMarkerIcon(country) {
  const cls = country==='Canada'?'canada':country==='Mexico'?'mexico':'usa';
  return L.divIcon({
    className:'',
    html:`<div class="venue-marker ${cls}" style="width:28px;height:28px"><div class="marker-inner">⚽</div></div>`,
    iconSize:[28,28], iconAnchor:[14,28], popupAnchor:[0,-30],
  });
}

// ── Filter helpers ────────────────────────────────────────────────────────────
function matchesForVenue(venueName) {
  let list = venueMatches[venueName] || [];
  if (activeFilter !== 'all') {
    list = activeFilter === 'Final'
      ? list.filter(m => m.stage==='Final'||m.stage==='Bronze Final')
      : list.filter(m => m.stage===activeFilter);
  }
  if (activeTeam)  list = list.filter(m => m.t1===activeTeam||m.t2===activeTeam);
  if (activeGroup) list = list.filter(m => m.group===activeGroup);
  return list;
}

// ── Popup builder ─────────────────────────────────────────────────────────────
function buildPopup(v) {
  const filtered = matchesForVenue(v.name);
  if (!filtered.length) return null;
  const total = (venueMatches[v.name]||[]).length;

  const rows = filtered.map(m => {
    const sc = STAGE_CLASS[m.stage]||'stage-group';
    const t1s = activeTeam&&m.t1===activeTeam?' style="color:#c9a227"':'';
    const t2s = activeTeam&&m.t2===activeTeam?' style="color:#c9a227"':'';
    const badge = m.group ? `<span class="group-highlight" style="background:${GROUP_COLOURS[m.group]}">Grp ${m.group}</span>` : '';
    const teams = m.t2
      ? `<div class="match-teams"><div class="team"${t1s}>${m.t1}</div><div class="vs">vs</div><div class="team"${t2s}>${m.t2}</div></div>`
      : `<div class="match-teams"><div class="team" style="font-size:13px">${m.t1}</div></div>`;

    let timesHTML = '';
    const utcMs = matchToUTC(m.date, m.time, v.utcOffset);
    const vt    = formatTime(utcMs, venueIANA(v));
    const ut    = formatTime(utcMs, USER_TZ);
    const ud    = formatDateShort(utcMs, USER_TZ);
    if (vt === ut && venueIANA(v) === USER_TZ) {
      timesHTML = `<div class="match-times"><div class="time-block"><div class="time-val">${vt}</div><div class="time-label">${v.tz} · ${v.tzLabel}</div></div></div>`;
    } else {
      timesHTML = `<div class="match-times">
        <div class="time-block"><div class="time-val">${vt}</div><div class="time-label">${v.tz} · venue</div></div>
        <div class="time-divider">·</div>
        <div class="time-block"><div class="time-val user-time">${ut}</div><div class="time-label">${USER_TZ_SHORT} · you</div></div>
      </div>`;
    }
    if (!m.date.includes(ud.split(' ').pop())) {
      timesHTML += `<div style="text-align:center;font-size:8px;color:#3a5a76;margin-top:1px">(your date: ${ud})</div>`;
    }

    return `<div class="match-row">
      <div class="match-meta">
        <span class="match-num">#${m.n}</span>
        <span class="match-date">${m.date}</span>
        <span class="match-stage ${sc}">${m.stage}</span>${badge}
      </div>
      ${teams}${timesHTML}
    </div>`;
  }).join('');

  return `<div class="popup-header">
    <div class="popup-city">${v.flag} ${v.name}</div>
    <div class="popup-country">${v.country}</div>
    <div class="popup-count">${filtered.length} match${filtered.length!==1?'es':''} shown${filtered.length<total?` · ${total} total`:''}</div>
  </div>
  <div class="popup-matches">${rows}</div>`;
}

// ── Markers ───────────────────────────────────────────────────────────────────
const markers = [];
VENUES.forEach(v => {
  const marker = L.marker([v.lat,v.lng],{icon:createMarkerIcon(v.country)})
    .addTo(map)
    .bindPopup('', {maxWidth:360, minWidth:260});
  marker._vd = v;
  marker.on('click', function() {
    const c = buildPopup(this._vd);
    if (c) { this.setPopupContent(c); this.openPopup(); }
  });
  const count = (venueMatches[v.name]||[]).length;
  marker.bindTooltip(`<b>${v.flag} ${v.name}</b><br>${count} matches`,{direction:'top',offset:[0,-30]});
  markers.push(marker);
});

// Legend
const legend = L.control({position:'bottomleft'});
legend.onAdd = () => {
  const d = L.DomUtil.create('div','legend');
  d.innerHTML = `<div style="font-weight:700;color:#c9a227;margin-bottom:6px;font-size:12px">Host Nations</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3c6eb4"></div>USA (11)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d52b1e"></div>Canada (2)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#006847"></div>Mexico (3)</div>`;
  return d;
};
legend.addTo(map);

// ── Refresh all markers ───────────────────────────────────────────────────────
function refreshMarkers() {
  markers.forEach(marker => {
    const count = matchesForVenue(marker._vd.name).length;
    marker.getElement()?.classList.toggle('marker-dimmed', count===0);
    if (marker.isPopupOpen()) {
      const c = buildPopup(marker._vd);
      c ? marker.setPopupContent(c) : marker.closePopup();
    }
  });
}

// ── Stage buttons ─────────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.stage;
    refreshMarkers();
  });
});

// ── Team search ───────────────────────────────────────────────────────────────
const searchInput  = document.getElementById('team-search');
const searchClear  = document.getElementById('search-clear');
const dropdown     = document.getElementById('team-dropdown');
const chip         = document.getElementById('active-team-chip');
const chipLabel    = document.getElementById('chip-label');
const chipClearBtn = document.getElementById('chip-clear');

function renderDropdown(query) {
  const q = query.toLowerCase();
  const list = TEAMS.filter(t => t.code.toLowerCase().includes(q)||t.name.toLowerCase().includes(q));
  dropdown.innerHTML = list.length
    ? list.map(t=>`<div class="team-option${activeTeam===t.code?' selected':''}" data-code="${t.code}">
        <span class="team-code">${t.code}</span>
        <span class="team-full">${t.name}</span>
        <span class="team-match-count">${teamMatchCount[t.code]||0}</span>
      </div>`).join('')
    : `<div class="team-option" style="color:#5a7a96;cursor:default">No results</div>`;
  dropdown.querySelectorAll('[data-code]').forEach(el =>
    el.addEventListener('click', () => selectTeam(el.dataset.code, TEAMS.find(t=>t.code===el.dataset.code)?.name)));
  dropdown.style.display = 'block';
}
function selectTeam(code, name) {
  activeTeam = code;
  searchInput.value = ''; searchClear.style.display = 'none'; dropdown.style.display = 'none';
  chipLabel.textContent = `${code} – ${name}`; chip.style.display = 'flex';
  refreshMarkers();
}
function clearTeam() {
  activeTeam = null; chip.style.display = 'none'; chipLabel.textContent = ''; refreshMarkers();
}
searchInput.addEventListener('input', function() {
  searchClear.style.display = this.value?'block':'none'; renderDropdown(this.value);
});
searchInput.addEventListener('focus', () => renderDropdown(searchInput.value));
searchClear.addEventListener('click', () => { searchInput.value=''; searchClear.style.display='none'; dropdown.style.display='none'; });
chipClearBtn.addEventListener('click', clearTeam);
document.addEventListener('click', e => {
  if (!document.getElementById('team-search-wrap').contains(e.target)) dropdown.style.display='none';
});

// ── Group buttons ─────────────────────────────────────────────────────────────
const groupLabel = document.getElementById('group-label');
document.querySelectorAll('.group-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const g = this.dataset.group;
    if (activeGroup === g) {
      activeGroup = null; this.classList.remove('active'); groupLabel.textContent = '';
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector('.filter-btn[data-stage="all"]').classList.add('active');
      activeFilter = 'all';
    } else {
      document.querySelectorAll('.group-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active'); activeGroup = g;
      groupLabel.style.color = GROUP_COLOURS[g];
      groupLabel.textContent = `Group ${g}: ${(GROUP_TEAMS[g]||[]).join(' · ')}`;
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      document.querySelector('.filter-btn[data-stage="Group Stage"]').classList.add('active');
      activeFilter = 'Group Stage';
    }
    refreshMarkers();
  });
});
